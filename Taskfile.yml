# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv:
  - .env

env:
  PROJECT_ROOT: '{{.ROOT_DIR}}'

vars:
  APP_NAME: "GC_agent"
  BIN_DIR: "bin"
  BUF_VERSION: "1.75.0"
  PROTOC_GEN_GO_VERSION: "1.36.12"
  PROTOC_GEN_GO_VERSION_GRPC: "1.6.2"
  PROTO_DIR: "/shared/proto"

  POSTGRES_URL: "postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@zapiski-postgres:5432/{{.POSTGRES_DB}}?sslmode=disable"

tasks:
  migrate-force-0:
    desc: "Сбрасывает dirty-состояние миграций на версию 0"
    cmds:
      - docker compose run --rm zapiski-postgres-migrate
        -path=/migrations
        -database=postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@zapiski-postgres:5432/{{.POSTGRES_DB}}?sslmode=disable
        force 0

  migrate-create:
    desc: "Создаёт новую миграцию: task migrate-create name=create_users"
    vars:
      NAME: '{{.name}}'
    requires:
      vars:
        - name
    cmds:
      - docker compose run --rm zapiski-postgres-migrate
        create
        -ext=sql
        -dir=/migrations
        -seq
        "{{.NAME}}"

  migrate-up:
    deps:
      - docker-up
    desc: "Применяет миграции"
    vars:
      LEVEL: '{{.LEVEL}}'
    cmds:
      - docker compose run --rm zapiski-postgres-migrate
        -path=/migrations
        -database=postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@zapiski-postgres:5432/{{.POSTGRES_DB}}?sslmode=disable
        up
        {{.CLI_ARGS}}

  migrate-down:
    deps:
      - docker-up
    desc: "Откатывает миграции"
    vars:
      LEVEL: '{{.LEVEL}}'
    cmds:
      - docker compose run --rm zapiski-postgres-migrate
        -path=/migrations
        -database=postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@zapiski-postgres:5432/{{.POSTGRES_DB}}?sslmode=disable
        down
        {{.CLI_ARGS}} 

  docker-up:
    desc: "Поднимает все докер контейнеры"
    cmds:
      - docker compose up -d

  docker-down:
    desc: "Останавливает все докер контейнеры"
    cmds:
      - docker compose down

  install-deps:
    desc: "Устанавливает зависимости, в основном плагины для gRPC"
    cmds:
      - GOBIN="{{.USER_WORKING_DIR}}/{{.BIN_DIR}}" go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
      - GOBIN="{{.USER_WORKING_DIR}}/{{.BIN_DIR}}" go install google.golang.org/protobuf/cmd/protoc-gen-go@v{{.PROTOC_GEN_GO_VERSION}}
      - GOBIN="{{.USER_WORKING_DIR}}/{{.BIN_DIR}}" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v{{.PROTOC_GEN_GO_VERSION_GRPC}}

  generate-proto:
    desc: "Генерирует код из .proto файлов"
    deps:
      - install-deps
    dir: "{{.ROOT_DIR}}/{{.PROTO_DIR}}"
    cmds:
      - "{{.ROOT_DIR}}/{{.BIN_DIR}}/buf generate"

  cleanup-binaries:
    desc: "Чистит бинарники сервисов перед запуском"
    cmds:
      - rm -f {{.BIN_DIR}}/agent

  build:
    desc: "Сборка приложения"
    deps:
      - cleanup-binaries
    cmds:
      - go build -o {{.BIN_DIR}}/agent ./agent/cmd

  run:
    desc: "Запускает собранное приложение"
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/agent