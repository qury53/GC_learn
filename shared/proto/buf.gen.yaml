version: v2
clean: true

managed:
  enabled: true
  override:
    # Правильный синтаксис для версии v2:
    - file_option: go_package_prefix
      value: github.com/qury53/GC_learn/shared/pkg/proto

plugins:
  - local: ../../bin/protoc-gen-go
    out: ../pkg/proto
    opt:
      - paths=source_relative

  - local: ../../bin/protoc-gen-go-grpc
    out: ../pkg/proto
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
