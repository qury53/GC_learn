syntax = "proto3";

package agent.V1;
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/qury/yourapp/gen/gigachat/agentv1;agentv1";

service AgentService {
    rpc ChatCompletion(ChatRequest) returns (ChatResponse);
}


// Запрос на генерацию ответа LLM.
message ChatRequest {
  string model = 1;

  repeated Message messages = 2;

  // Максимальное количество генерируемых токенов.
  optional int32 max_tokens = 3;

  // Температура сэмплирования.
  optional double temperature = 4;
}

// Сообщение диалога.
message Message {
  Role role = 1;
  string content = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
}

// Ответ LLM.
message ChatResponse {
  string thread_id = 1;
  string model = 2;
  string content = 3;

  FinishReason finish_reason = 4;

  Usage usage = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
  FINISH_REASON_TOOL_CALLS = 3;
  FINISH_REASON_CONTENT_FILTER = 4;
}

// Статистика использования токенов.
message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 total_tokens = 3;
  int32 cached_tokens = 4;
}
